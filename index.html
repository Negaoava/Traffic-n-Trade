<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic &amp; Trade</title>

  <!-- Press Start 2P pixel font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main_menu.css">
</head>
<body>
  <main class="screen">
    <div class="title-container">
      <h1 class="title">TRAFFIC 'N TRADE</h1>
    </div>

    <!-- Main Menu  -->
    <nav class="menu">
      <button class="menu-btn" type="button">START</button>
      <button class="menu-btn options-btn" type="button">OPTIONS</button>
      <button class="menu-btn" type="button">CREDITS</button>

      <!-- Options Menu  -->
      <div class="options-menu">
        <div style="position: relative; padding-bottom: 50px;">
          <p style="text-align: center;">Options</p>
          <button class="close-menu-btn">X</button>
        </div>
        <div style="display: flex; flex-direction: column; font-size: 12px;">
          <div class="sound-slider">
            <p>Sound</p>
            <input type="range" name="sound" id="">
          </div>
          <div class="music-slider">
            <p class="music">Music</p>
            <input type="range" name="music" id="">
          </div>
        </div>
      </div>
    </nav>

  </main>

  <div class="black-overlay"></div>

  <script src="scripts/main_menu.js"></script>
</body>
</html>
