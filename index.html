<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic &amp; Trade</title>

  <script>
    try { if (JSON.parse(localStorage.getItem("tt-settings") || "{}").crt === false) document.documentElement.classList.add("no-crt"); } catch (e) {}
    if (sessionStorage.getItem("tt-crt-transition")) document.documentElement.classList.add("crt-entering");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/crt.css">
  <link rel="stylesheet" href="styles/main_menu.css">
</head>
<body>
  <main class="screen">
    <div class="osd osd-top-left">&#9654; PLAY</div>
    <div class="osd osd-top-right">CH 03</div>
    <div class="osd osd-bottom-left"><span id="osd-clock">00:00:00</span></div>
    <div class="osd osd-bottom-right">&copy; T&amp;T CORP.</div>

    <div class="title-container">
      <h1 class="title">TRAFFIC 'N TRADE</h1>
    </div>

    <nav class="menu">
      <a href="game.html">
        <button class="menu-btn btn" type="button">START</button>
      </a>
      <button class="menu-btn options-btn btn" type="button" data-sfx="gear">OPTIONS</button>
      <button class="menu-btn btn" type="button">CREDITS</button>
    </nav>

    <!-- moved out of <nav> so it can be a proper centered panel -->
    <div class="options-menu" role="dialog" aria-label="Options">
      <div class="options-head">
        <p>OPTIONS</p>
        <button class="close-menu-btn btn" type="button" data-sfx="gearClose">X</button>
      </div>
      <div id="options-body"></div>
    </div>
  </main>

  <div class="black-overlay"></div>

  <script src="scripts/main_menu.js" type="module"></script>
</body>
</html>
